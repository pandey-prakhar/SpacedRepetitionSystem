spring.application.name=revisor

# --- Datasource (H2 file-based, persists across restarts) ---
# AUTO_SERVER=TRUE lets the H2 web console open the same file the app is using
spring.datasource.url=jdbc:h2:file:./data/revisordb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 browser console (http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# `update` keeps schema across restarts and additively applies entity changes.
# For real migrations later, swap to Flyway and set ddl-auto=validate.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson: serialize LocalDate as "2026-05-08", not [2026,5,8] ---
spring.jackson.serialization.write-dates-as-timestamps=false
