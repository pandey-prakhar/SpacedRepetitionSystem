spring.application.name=revisor

# --- Datasource (H2 in-memory) ---
spring.datasource.url=jdbc:h2:mem:revisordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 browser console (http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson: serialize LocalDate as "2026-05-08", not [2026,5,8] ---
spring.jackson.serialization.write-dates-as-timestamps=false
